<form [formGroup]="formData" (ngSubmit)="onSubmit()">
    <div class="container-form">
        <h1>Crea una categoria</h1>
        <!-- Nombre -->
        <div class="field">
            <label for="nombre-de-la-categoria">Nombre de la categoria</label>
            <input type="text" formControlName="name" id="nombre-de-la-categoria">
        </div>
        <!-- Descripción -->
        <div class="field">
            <label for="descripcion-categoria">Descripcion de la categoria</label>
            <textarea formControlName="description" id="descripcion-categoria"></textarea>
        </div>
        <div class="field">
            <button type="submit">Registrar categoria</button>
        </div>

    </div>


</form>
