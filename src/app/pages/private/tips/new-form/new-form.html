

<form 
    [formGroup]="formData" 
    (submit)="onSubmit()"
    class="form form-login"
>
    <div class="container-form">
        <h1>Crea tu Tip</h1>
        <!-- Título -->
        <div class="field">
            <label for="titulo">Título:</label><br>
            <input type="text" id="titulo" formControlName="titulo" required><br><br>
        </div>

        <!-- Contenido -->
        <div class="field">
            <label for="contenido">Contenido:</label><br>
            <textarea id="contenido" formControlName="contenido" rows="5" cols="40" required></textarea><br><br>
        </div>

        <!-- Tipo -->
        <!-- <div class="field">
            <label for="tipo">Tipo:</label><br>
            <input type="text" id="tipo" name="tipo" placeholder="Ej. Motricidad, Lectura, Juego, etc."
                required><br><br>
        </div> -->
        <div class="field">
            <label for="tipo-tips">Tipo</label>
            <select formControlName="tipo" id="tipo-tips">
                <option value="">Selected..</option>
                <option value="motricidad">Motricidad</option>
                <option value="lectura">Lectura</option>
                <option value="uso">Uso</option>
                <option value="educativo">Educativo</option>
                <option value="seguridad">Seguridad</option>
                <option value="psicomotor">Psicomotor</option>
                <option value="juego">Juego</option>
                
            </select>
        </div>


        <!-- Edad recomendada -->
        <div class="field">
            <label for="edad-recomendada">Edad recomendada:</label><br>
            <select formControlName="edadRecomendada" id="edad-recomendada">
                <option value="">Selected..</option>
                <option value="0-12 meses">0-12 Meses</option>
                <option value="1-3 años">1-3 Años</option>
                <option value="2-5 años">2-5 Años</option>
                <option value="5-12 años">5-12 Años</option>
            </select>
            
        </div>


        <!-- Imagen -->
        <!-- <div class="field">
            <label for="imagen">Adjuntar imagen:</label><br>
            <input type="file" id="imagen" name="imagen" accept="image/*" required><br><br>
        </div> -->

        <!-- Autor -->
        <div class="field">
            <label for="autor">Autor:</label><br>
            <select formControlName="autor" id="Autor-tips">
                <option value="">Selected..</option>
                @for (objUsers of users; track $index) {
                    <option [value]="objUsers._id">{{objUsers.name}}</option>
                }
                

            </select>
        </div>

        <!-- Botón -->
        <div class="field">
            <button type="submit">Cargar Tip</button>
        </div>
    </div>


</form>
